# ============================================================
# ShadowCoders — Production Nginx Configuration
# Optimized for 400 concurrent students
# ============================================================

# Worker processes = number of CPU cores
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ============================================================
    # General settings
    # ============================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;          # Hide nginx version

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================================
    # Upstream backends (PM2 cluster)
    # ============================================================
    upstream api_backend {
        server 127.0.0.1:4000;
        keepalive 64;           # Persistent connections to Express
    }

    upstream frontend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # ============================================================
    # Rate limiting zones
    # ============================================================
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=submission:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=ws:10m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # ============================================================
    # Logging (minimal in production)
    # ============================================================
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" $request_time';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # ============================================================
    # Gzip compression
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/wasm;

    # ============================================================
    # Server block
    # ============================================================
    server {
        listen 80;
        server_name _;           # Replace with your domain/IP

        # Security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Client body limits
        client_max_body_size 5m;        # Reduced from 10m
        client_body_buffer_size 128k;
        client_body_timeout 10s;
        client_header_timeout 10s;

        # Per-IP connection limit (prevent connection flooding)
        limit_conn perip 50;

        # ============================================================
        # Login endpoint (strict rate limit to prevent brute force)
        # ============================================================
        location = /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================================
        # Code execution (strict rate limit)
        # ============================================================
        location ~ ^/api/(execution|student/attempts/.*/run-code) {
            limit_req zone=submission burst=5 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;     # Max 30s for code execution
            proxy_send_timeout 10s;

            # Limit request body for code submissions
            client_max_body_size 512k;
        }

        # ============================================================
        # General API routes
        # ============================================================
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";   # Enable keepalive
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 8k;
        }

        # ============================================================
        # WebSocket (Socket.IO) 
        # ============================================================
        location /socket.io/ {
            limit_conn ws 20;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;  # 24h for persistent WebSocket
            proxy_send_timeout 86400s;
        }

        # ============================================================
        # Uploaded files (static serve with caching)
        # ============================================================
        location /uploads/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ============================================================
        # Health check (no rate limit, no logging)
        # ============================================================
        location = /api/healthz {
            access_log off;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Queue status (no rate limit, no logging)
        location = /api/queue/status {
            access_log off;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ============================================================
        # Next.js static assets (aggressive caching)
        # ============================================================
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ============================================================
        # Frontend (Next.js) — catch-all
        # ============================================================
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
